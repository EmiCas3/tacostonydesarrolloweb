<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <form name="forms" method="post" action="calc.php">
    <h1><b>Ejemplo de procesado de formularios</b></h1>
            Dato 1:
            <input type="number" name="dat1" style="width: 75px;" >&nbsp;&nbsp;&nbsp;&nbsp;
            Dato 2:
            <input type="number" name="dat2" style="width: 75px;">
            <br>
    <br>
    <input type="radio" name="operacion" value="1">Suma              &nbsp;&nbsp;
    <input type="radio" name="operacion" value="2">Multiplica    &nbsp;&nbsp;
    <input type="radio" name="operacion" value="3">Resta             &nbsp;&nbsp;
    <input type="radio" name="operacion" value="4">Divide          &nbsp;&nbsp;
    <br>
    <br>
    <input type="button" name="Enviar" value="Enviar" onclick="valida_enviar()">

    <script>
        function valida_enviar() { 
            if(document.forms.dat1.value =="" || document.forms.dat2.value==""){
                alert("Datos faltantes")
                return 0;
            }
            if (document.forms.operacion.value!="1" && document.forms.operacion.value!="2" && document.forms.operacion.value!="3" && document.forms.operacion.value!="4"){
                alert("Tiene que seleccionar una opcion")
                return 0;
            }
            document.forms.submit();
        }
    </script>
</form>
</body>
</html>
