<!DOCTYPE html>
<html lang="es">
<!--Usuario: admin 
Contraseña: admin-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tacos Tony</title>
    <style>
        body {
            background-color: #e5e5e5;
            font-family: Arial, sans-serif;
            display: flex;
            margin: 0;
        }

        .login-card {
            background-color: #FFFFFF;
            padding: 50px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            background-color: #e5e5e5;
            box-sizing: border-box;
            font-size: 15px;
        }

        .input-group input::placeholder {
            color: #7a7676;
        }

        .input-group input:focus {
            border-color: #F6821F;
        }

        .error-message {
            color: red;
            font-size: 15px;
            margin-bottom: 15px;
            display: none;
        }

        .button {
            width: 100%;
            padding: 15px;
            background-color: #F6821F;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background-color: #c9793c;
        }
    </style>
</head>

<body style="height: 100vh; justify-content: center; align-items: center">

    <div class="login-card">
        <img src="./Imagenes/Tacos_tony_logo.png" name="Logo" width="220" margin-bottom="25px">
        <h2 style="font-size: large;">Sistema de control de inventario</h2>

        <form id="loginForm" method="post" action="Ventas1.html">
            <div class="input-group">
                <input type="text" name="user" placeholder="Usuario" required>
            </div>
            <div class="input-group">
                <input type="password" name="contra" placeholder="Contraseña" required>
            </div>

            <input class="button" type="button" name="Ingresar" value="INGRESAR" onclick="valida_enviar()">
        </form>
    </div>

    <script>
        function valida_enviar() {
            var form = document.getElementById("loginForm");
            if (form.user.value == "") {
                alert("Usuario no ingresado")
                return 0;
            }
            if (form.contra.value == "") {
                alert("Contraseña no ingresada")
                return 0;
            }
            if (form.user.value != "admin" || form.contra.value != "admin") {
                alert("Usuario o contraseña incorrectos")
                return 0;
            } else {
                window.location.href = "./barra_lateral/Dashboard.html";
            }
        }
    </script>

</body>
<!--Preguntar como evitar que funcione el botón de regresar-->

</html>
