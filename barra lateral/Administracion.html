<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos Tony - Administracion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #E5E5E5;
            margin: 0;
            padding: 20px;
            display: flex;
            box-sizing: border-box;
        }

        .sidebar {
            background-color: #FFFFFF;
            width: 250px;
            border-radius: 10px;
            padding-top: 20px;
            padding-bottom: 20px;
            margin-right: 30px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .1);
            position: sticky;
            top: 20px;
        }

        .menu-item {
            padding: 15px 20px;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Clase activo ahora en Movimientos */
        .menu-item.activo {
            background-color: #f6821f;
            color: #000000;
        }

        .menu-item:hover:not(.activo) {
            background-color: #F9D864;
        }

        /* --- Estilos de la Sección Principal (Movimientos) --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movimientos-card {
            background-color: #FFFFFF;
            border-radius: 15px;
            padding: 60px 50px;
            width: 100%;
            max-width: 700px;
            box-shadow: 2px 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Titulo Superior ("¿Qué desea registrar?") */
        .titulo-caja {
            background: #f6821f;
            color: #000000;
            font-weight: bold;
            font-size: 22px;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 60px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.15);
        }

        /* Contenedor de Botones (Entradas y Ventas) */
        .botones-contenedor {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .btn-opcion {
            background: #f6821f;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            text-align: center;
            padding: 30px 20px;
            border-radius: 12px;
            flex: 1;
            /* Para que ambos botones midan lo mismo */
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-opcion:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div
        style="background-color: #FFFFFF; width: 250px; border-radius: 10px; padding-top: 20px; padding-bottom: 20px; margin-right: 30px; box-shadow: 2px 2px 10px rgba(0, 0, 0, .5); height: 100%">
        <div align="center">
            <a href="Dashboard.html">
                <img src="../Imagenes/Tacos_tony_logo.png" width="200" alt="Logo">
            </a>
        </div>

        <a href="Dashboard.html" class="menu-item">
            <img src="../Imagenes/icon-dash.png" width="25" name="Dashboard"> Dashboard

            <a href="Inventario.html" class="menu-item">
                <img src="../Imagenes/icon-inv.png" width="25" name="Inventario"> Inventario
            </a>
            <a href="Movimientos.html" class="menu-item">
                <img src="../Imagenes/icon-mov.png" width="25" name="Movimientos"> Movimientos
            </a>
            <a href="Reportes.html" class="menu-item">
                <img src="../Imagenes/icon-repo.png" width="25" name="Reportes"> Reportes
            </a>
            <a href="Administracion.html" class="menu-item activo">
                <img src="../Imagenes/icon-admin.png" width="25" name="Administración"> Administración
            </a>
            <a href="Configuracion.html" class="menu-item">
                <img src="../Imagenes/icon-config.png" width="25" name="Configuración"> Configuración
            </a>
    </div>

    <div class="main-content">
        <div class="movimientos-card">

            <div class="titulo-caja">
                ¿QUÉ DESEA REGISTRAR?
            </div>

            <div class="botones-contenedor">
                <a href="Clientes.html" class="btn-opcion">CLIENTES</a>
                <a href="Colaboradores.html" class="btn-opcion">COLABORADORES</a>
            </div>

        </div>
    </div>

</body>

</html>
