<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos Tony - Reportes</title>
    <style>
        /*COLORES DE LA EMPRESA
        Naranja: #F6821F | Azul: #073A79 | Amarillo: #F9D864 
        Blanco: #FFFFFF  | Negro: #000000 | Gris: #E5E5E5 */
        body {
            font-family: Arial, sans-serif;
            background-color: #E5E5E5;
            margin: 0;
            padding: 20px;
            display: flex;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Sidebar similar a Dashboard */
        .sidebar {
            background-color: #FFFFFF;
            width: 250px;
            border-radius: 10px;
            padding-top: 20px;
            padding-bottom: 20px;
            margin-right: 30px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
            display: flex;
            flex-direction: column;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .menu-item {
            padding: 15px 20px;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-item.activo {
            background-color: #F6821F;
            color: #000000;
        }

        .menu-item:hover:not(.activo) {
            background-color: #F9D864;
        }

        /* Contenedor Principal (Reportes) */
        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tarjeta-reportes {
            background-color: #FFFFFF;
            border-radius: 10px;
            padding: 60px 40px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
        }

        .botones-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            justify-items: center;
        }

        .btn-reporte {
            background-color: #DC7B3C;
            /* Naranja similar a la imagen */
            color: #000000;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, background-color 0.2s;
            line-height: 1.3;
        }

        .btn-reporte:hover {
            background-color: #F6821F;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <!-- Menú Lateral -->
    <div class="sidebar">
        <div class="logo-container">
            <a href="Dashboard.html">
                <img src="../Imagenes/Tacos_tony_logo.png" width="200" alt="Logo">
            </a>
        </div>

        <a href="Dashboard.html" class="menu-item">
            <img src="../Imagenes/icon-dash.png" width="25" alt="Dashboard"> Dashboard
        </a>
        <a href="Inventario.html" class="menu-item">
            <img src="../Imagenes/icon-inv.png" width="25" alt="Inventario"> Inventario
        </a>
        <a href="Movimientos.html" class="menu-item">
            <img src="../Imagenes/icon-mov.png" width="25" alt="Movimientos"> Movimientos
        </a>
        <a href="Reportes.html" class="menu-item activo">
            <img src="../Imagenes/icon-repo.png" width="25" alt="Reportes"> Reportes
        </a>
        <a href="Administracion.html" class="menu-item">
            <img src="../Imagenes/icon-admin.png" width="25" alt="Administración"> Administración
        </a>
        <a href="Configuracion.html" class="menu-item">
            <img src="../Imagenes/icon-config.png" width="25" alt="Configuración"> Configuración
        </a>
    </div>

    <!-- Contenido Principal -->
    <div class="main-content">
        <div class="tarjeta-reportes">
            <div class="botones-grid">
                <button class="btn-reporte">INGRESO POR PRODUCTO</button>
                <button class="btn-reporte">CORTE DIARIO</button>
                <button class="btn-reporte">ADMINISTRACIÓN POR<br>MES</button>
                <button class="btn-reporte">GANANCIA POR<br>PRODUCTO</button>
                <button class="btn-reporte">ROTACIÓN</button>
                <button class="btn-reporte">FACTURAS POR FECHA</button>
                <button class="btn-reporte">MATERIALES MÁS<br>USADOS</button>
                <button class="btn-reporte">SUMINISTROS POR FECHA</button>
            </div>
        </div>
    </div>
</body>

</html>
