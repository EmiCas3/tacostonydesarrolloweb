<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="../Imagenes/TTlogomini.png">
    <title>Tacos Tony - Dashboard</title>
    <style>
        /*COLORES DE LA EMPRESA
        Naranja: #F6821F | Azul: #073A79 | Amarillo: #F9D864 
        Blanco: #FFFFFF  | Negro: #000000 | Gris: #E5E5E5 */
        body {
            font-family: Arial, sans-serif;
            background-color: #E5E5E5;
            margin: 0;
            padding: 20px;
            display: flex;
        }

        h1 {
            color: #000000;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .menu-item {
            padding: 15px 20px;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-item.activo {
            background-color: #F6821F;
        }

        .menu-item:hover:not(.activo) {
            background-color: #F9D864;
        }

        .cajas-superiores {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .caja {
            background-color: #FFFFFF;
            border-radius: 10px;
            width: 50%;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            padding: 15px;
        }

        .encabezado-caja {
            background-color: #F6821F;
            color: #000000;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .inventory {
            font-weight: bold;
            font-size: 14px;
            width: 100%;
        }

        .caja-inferior {
            background-color: #FFFFFF;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .contenido-inferior {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .columna-botones {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .botones {
            background-color: #F6821F;
            color: #000000;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 250px;
        }

        .botones:hover {
            background-color: #c9793c;
        }

        .menu-dropdown {
            position: relative;
        }

        .submenu {
            display: none;
            flex-direction: column;
            background-color: #f9f9f9;
            border-left: 4px solid #F6821F;
            margin-left: 20px;
            margin-right: 20px;
            margin-top: -5px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .menu-dropdown:hover .submenu {
            display: flex;
        }

        .submenu-item {
            padding: 12px 20px;
            color: #333333;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
        }

        .submenu-item:hover {
            color: #F6821F;
            background-color: #E5E5E5;
        }
    </style>
</head>

<body>
    <div
        style="background-color: #FFFFFF; width: 250px; border-radius: 10px; padding-top: 20px; padding-bottom: 20px; margin-right: 30px; box-shadow: 2px 2px 10px rgba(0, 0, 0, .5); height: 100%">
        <div align="center">
            <a href="Dashboard.html">
                <img src="../Imagenes/Tacos_tony_logo.png" width="200" alt="Logo">
            </a>
        </div>

        <a href="Dashboard.html" class="menu-item activo">
            <img src="../Imagenes/icon-dash.png" width="25" name="Dashboard"> Dashboard

            <a href="Inventario.html" class="menu-item">
                <img src="../Imagenes/icon-inv.png" width="25" name="Inventario"> Inventario
            </a>
            <a href="Movimientos.html" class="menu-item">
                <img src="../Imagenes/icon-mov.png" width="25" name="Movimientos"> Movimientos
            </a>
            <a href="Reportes.html" class="menu-item">
                <img src="../Imagenes/icon-repo.png" width="25" name="Reportes"> Reportes
            </a>
            <a href="Administracion.html" class="menu-item">
                <img src="../Imagenes/icon-admin.png" width="25" name="Administración"> Administración
            </a>
            <div class="menu-dropdown">
                <a class="menu-item">
                    <img src="../Imagenes/icon-config.png" width="25" name="Configuración"> Configuración
                </a>
                <div class="submenu">
                    <a href="Configuracion.html" class="submenu-item">Editar Perfil</a>
                    <a href="../Login.html" class="submenu-item">Cerrar Sesión</a>
                </div>
            </div>
    </div>

    <div style="flex-grow:1">
        <h1>Dashboard</h1>

        <div class="cajas-superiores">
            <div class="caja">
                <div class="encabezado-caja">
                    <img src="../Imagenes/icon-warning.png" width="20" name="Warning"> INVENTARIO BAJO
                </div>
                <table class="inventory">
                    <tr>
                        <td>Tortilla de maiz</td>
                        <td align="right">1 Kg</td>
                    </tr>
                    <tr>
                        <td>Carne de cerdo</td>
                        <td align="right">2 Kg</td>
                    </tr>
                </table>
            </div>
            <div class="caja">
                <div class="encabezado-caja">
                    <img src="../Imagenes/icon-warning.png" width="20" name="Warning"> TIEMPO GUARDADO
                </div>
                <table class="inventory">
                    <tr>
                        <td>Cilantro</td>
                        <td align="right">15 Días</td>
                    </tr>
                    <tr>
                        <td>Cebolla</td>
                        <td align="right">18 Días</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="caja-inferior">
            <h2>RESUMEN DE INVENTARIO</h2>

            <div class="contenido-inferior">
                <div class="columna-botones">
                    <a href="Pant_movimientos/Pant_entradas/Entrada1.html">
                        <button class="botones">REGISTRAR ENTRADA</button>
                    </a>

                    <a href="Inventario.html">
                        <button class="botones">AJUSTAR INVENTARIO</button>
                    </a>

                </div>

                <div style="background-color: #F6821F; padding: 15px; border-radius: 10px">
                    <img src="../Imagenes/grafica.png" width="200" name="Grafica" alt="Grafica de resumen de la BDD">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
