            min-height: 100vh;
        }

        .menu-item {

            text-decoration: none;

        }

        .main-content {

            border-radius: 15px;

            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);

            overflow: hidden;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);

            background: #f6821f;
            color: #000;
            font-weight: bold;
            display: flex;
            padding: 15px 30px;
        }

            overflow-y: auto;
            padding: 10px 0;
        }

        .tabla-body::-webkit-scrollbar {
            width: 6px;
        }

        .tabla-body::-webkit-scrollbar-track {
            background: transparent;
            margin: 10px 0;
        }

        .tabla-body::-webkit-scrollbar-thumb {
            background-color: #A0A0A0;
            border-radius: 10px;
        }

        .fila {
            display: flex;
            padding: 10px 30px;
            font-weight: bold;
            color: #333;
            align-items: center;
        }

        .col-id {
            width: 15%;
        }

        .col-mat {
            width: 45%;
        }

        .col-stock {
            width: 25%;

        }

            justify-content: center;

            color: #000000;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);

            text-align: center;

            border: none;

            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-secundario:hover {

            flex-direction: column;
            background-color: #f9f9f9;
            border-left: 4px solid #F6821F;
            margin-left: 20px;
            margin-right: 20px;

            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        }

        .submenu-item {

            color: #333333;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;

            background-color: #E5E5E5;
