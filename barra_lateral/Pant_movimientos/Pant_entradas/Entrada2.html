<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../Imagenes/TTlogomini.png">
    <title>Tacos Tony - Movimientos - Entradas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #E5E5E5;
            margin: 0;
            padding: 20px;
            display: flex;
            box-sizing: border-box;
        }

        .menu-item {
            padding: 15px 20px;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-item.activo {
            background-color: #f6821f;
        }

        .menu-item:hover:not(.activo) {
            background-color: #F9D864;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .formulario-card {
            background-color: #FFFFFF;
            border-radius: 15px;
            padding: 50px;
            width: 100%;
            max-width: 700px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
        }

        .titulo-caja {
            background: #f6821f;
            color: #000000;
            font-weight: bold;
            font-size: 22px;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }

        .input-grupo {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-grupo label {
            font-weight: bold;
            color: #333333;
            font-size: 14px;
        }

        .input-grupo input,
        .input-grupo select,
        .input-grupo datalist {
            background-color: #F0F0F0;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 15px;
            outline: none;
            color: #333;
            font-family: Arial, sans-serif;
        }

        .input-grupo input:focus,
        .input-grupo select:focus,
        .input-grupo datalist:focus {
            border-color: #f6821f;
        }

        .botones-bottom {
            display: flex;
            justify-content: space-between;
        }

        .btn-accion {
            background: #f6821f;
            color: #000000;
            border: none;
            padding: 15px 50px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-accion:hover {
            background-color: #DC7B3C;
        }

        .btn-secundario {
            background: #f6821f;
            color: #000000;
            border: none;
            padding: 15px 50px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-secundario:hover {
            background-color: #DC7B3C;
        }

        .menu-dropdown {
            position: relative;
        }

        .submenu {
            display: none;
            flex-direction: column;
            background-color: #f9f9f9;
            border-left: 4px solid #F6821F;
            margin-left: 20px;
            margin-right: 20px;
            margin-top: -5px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .menu-dropdown:hover .submenu {
            display: flex;
        }

        .submenu-item {
            padding: 12px 20px;
            color: #333333;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
        }

        .submenu-item:hover {
            color: #F6821F;
            background-color: #E5E5E5;
        }
    </style>
</head>

<body>
    <div
        style="background-color: #FFFFFF; width: 250px; border-radius: 10px; padding-top: 20px; padding-bottom: 20px; margin-right: 30px; box-shadow: 2px 2px 10px rgba(0, 0, 0, .5); height: 100%; position: sticky; top: 20px;">
        <div align="center">
            <a href="../../Dashboard.html">
                <img src="../../../Imagenes/Tacos_tony_logo.png" width="200" alt="Logo">
            </a>
        </div>

        <a href="../../Dashboard.html" class="menu-item">
            <img src="../../../Imagenes/icon-dash.png" width="25" name="Dashboard"> Dashboard
        </a>
        <a href="../../Inventario.html" class="menu-item">
            <img src="../../../Imagenes/icon-inv.png" width="25" name="Inventario"> Inventario
        </a>
        <a href="../../Movimientos.html" class="menu-item activo">
            <img src="../../../Imagenes/icon-mov.png" width="25" name="Movimientos"> Movimientos
        </a>
        <a href="../../Reportes.html" class="menu-item">
            <img src="../../../Imagenes/icon-repo.png" width="25" name="Reportes"> Reportes
        </a>
        <a href="../../Administracion.html" class="menu-item">
            <img src="../../../Imagenes/icon-admin.png" width="25" name="Administración"> Administración
        </a>
        <div class="menu-dropdown">
            <a class="menu-item">
                <img src="../../../Imagenes/icon-config.png" width="25" name="Configuración"> Configuración
            </a>
            <div class="submenu">
                <a href="../../Configuracion.html" class="submenu-item">Editar Perfil</a>
                <a href="../../../Login.html" class="submenu-item">Cerrar Sesión</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="formulario-card">

            <div class="titulo-caja">
                REGISTRAR ENTRADA
            </div>

            <form id="entrada2form" method="post" action="#">
                <div class="form-grid">
                    <div class="input-grupo">
                        <label>Nombre Material</label>
                        <input type="text" list="listaMateriales" id="nombreMaterial" placeholder="Ingrese el nombre">
                        <datalist id="listaMateriales">
                            <option value="Carne"></option>
                            <option value="Cebolla"></option>
                            <option value="Tortilla de Maíz"></option>
                            <option value="Tortilla de Harina"></option>
                            <option value="Refresco"></option>
                            <option value="Agua"></option>
                            <option value="Servilletas"></option>
                            <option value="Vasos"></option>
                            <option value="Platos"></option>
                            <option value="Cubiertos"></option>
                        </datalist> <!--Preguntar en clase si hay algo distinto al datalist-->
                    </div>

                    <div class="input-grupo">
                        <label>ID Material</label>
                        <input type="number" id="idMaterial" placeholder="Ingrese el ID">
                    </div>

                    <div class="input-grupo">
                        <label>Cantidad</label>
                        <input type="number" id="cantidad" placeholder="Ingrese la cantidad">
                    </div>

                    <div class="input-grupo">
                        <label>Precio Unitario</label>
                        <input type="number" id="precioUnitario" placeholder="Ingrese el precio unitario" step="0.01">
                    </div>
                </div>

                <div style="text-align: center; margin-top: -10px; margin-bottom: 30px;">
                    <button type="button" onclick="document.getElementById('entrada2form').reset()"
                        style="background: none; border: none; cursor: pointer; padding: 0; margin: 0 auto 10px auto; display: block;">
                        <img src="../../../Imagenes/masP.png" alt="Agregar" style="width: 45px; height: auto;">
                    </button>
                    <div style="color: #888; font-size: 16px;">¿Agregar otro material?</div>
                </div>

                <div class="botones-bottom" style="justify-content: space-between; width: 100%;">
                    <input type="button" value="ATRÁS" onClick="history.go(-1)" class="btn-secundario">
                    <a class="btn-accion" onclick="validarEntrada()">CONFIRMAR</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function validarEntrada() {
            var form = document.getElementById("entrada2form");
            if (form.idMaterial.value == "") {
                alert("ID de material no ingresado");
                return 0;
            } if (form.nombreMaterial.value == "") {
                alert("Nombre de material no ingresado");
                return 0;
            } if (form.cantidad.value == "") {
                alert("Cantidad no ingresada");
                return 0;
            } if (form.precioUnitario.value == "") {
                alert("Precio unitario no ingresado");
                return 0;
            } else {
                alert("Entrada registrada con éxito.");
                window.location.href = "../../Movimientos.html";
            }
        }
    </script>
</body>

</html>
