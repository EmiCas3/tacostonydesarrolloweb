<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" sizes="16x16" href="../Imagenes/TTlogomini.png">
    <title>Tacos Tony - Administracion - Colaboradores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #E5E5E5;
            margin: 0;
            padding: 20px;
            display: flex;
            box-sizing: border-box;
        }

        .sidebar {
            background-color: #FFFFFF;
            width: 250px;
            border-radius: 10px;
            padding-top: 20px;
            padding-bottom: 20px;
            margin-right: 30px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
            position: sticky;
            top: 20px;
        }

        .menu-item {
            padding: 15px 20px;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-item.activo {
            background-color: #f6821f;
        }

        .menu-item:hover:not(.activo) {
            background-color: #F9D864;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movimientos-card {
            background-color: #FFFFFF;
            border-radius: 15px;
            padding: 60px 50px;
            width: 100%;
            max-width: 700px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
        }

        .titulo-caja {
            background: #f6821f;
            color: #000000;
            font-weight: bold;
            font-size: 22px;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 60px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
        }

        .botones-contenedor {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .btn-opcion {
            background: #f6821f;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            text-align: center;
            padding: 30px 20px;
            border-radius: 12px;
            flex: 1;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, .5);
        }

        .btn-opcion:hover {
            background-color: #DC7B3C;
        }

        .menu-dropdown {
            position: relative;
        }

        .submenu {
            display: none;
            flex-direction: column;
            background-color: #f9f9f9;
            border-left: 4px solid #F6821F;
            margin-left: 20px;
            margin-right: 20px;
            margin-top: -5px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .menu-dropdown:hover .submenu {
            display: flex;
        }

        .submenu-item {
            padding: 12px 20px;
            color: #333333;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
        }

        .submenu-item:hover {
            color: #F6821F;
            background-color: #E5E5E5;
        }
    </style>
</head>

<body>

                    <a href="../Login.html" class="submenu-item">Cerrar Sesión</a>
                </div>

</body>
